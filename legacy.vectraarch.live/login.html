<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legacy · Access · VectraArch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/shared/va.css"/>
  <link rel="stylesheet" href="/shared/auth.css"/>
</head>
<body>
<div class="grid-bg"></div>
<div class="accent-lines auth-accent-lines" aria-hidden="true">
  <svg viewBox="0 0 600 900" fill="none" preserveAspectRatio="xMaxYMid slice">
    <line x1="580" y1="0" x2="20" y2="900" stroke="rgba(212,160,23,0.07)" stroke-width="1"/>
    <line x1="540" y1="0" x2="0" y2="760" stroke="rgba(212,160,23,0.05)" stroke-width="0.5"/>
    <line x1="600" y1="200" x2="100" y2="900" stroke="rgba(212,160,23,0.04)" stroke-width="1"/>
    <rect x="460" y="80" width="100" height="1" fill="rgba(212,160,23,0.15)"/>
    <rect x="480" y="120" width="60" height="1" fill="rgba(212,160,23,0.1)"/>
    <circle cx="540" cy="180" r="60"  stroke="rgba(212,160,23,0.06)"  stroke-width="1"   fill="none"/>
    <circle cx="540" cy="180" r="90"  stroke="rgba(212,160,23,0.04)"  stroke-width="0.5" fill="none"/>
    <circle cx="540" cy="180" r="130" stroke="rgba(212,160,23,0.025)" stroke-width="0.5" fill="none"/>
  </svg>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">Vectra Arch · Legacy</div>
    <div class="auth-title">Access</div>
    <div class="auth-sub">Lifestyle Management · Authorised Entry Only</div>

    <div class="auth-warning">
      <div class="auth-warning-dot"></div>
      <span class="auth-warning-text">Restricted · Authorised Personnel Only</span>
    </div>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <div id="creds-fields">
      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input class="auth-input" id="username" type="text"
               placeholder="username" autocomplete="username" required autofocus/>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" id="password" type="password"
               placeholder="········" autocomplete="current-password" required/>
      </div>
    </div>

    <!-- 2FA step (hidden until needed) -->
    <div id="twofa-field" class="auth-field" style="display:none;">
      <label class="auth-label" for="twofa">Authentication Code</label>
      <input class="auth-input auth-input-code" id="twofa" type="text"
             placeholder="000000" maxlength="6" autocomplete="one-time-code"/>
    </div>

    <button class="auth-submit" id="submit-btn" onclick="doLogin()">Authenticate ↗</button>

    <div id="google-divider" class="auth-divider" style="display:flex;align-items:center;gap:10px;margin:18px 0 10px;">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;color:rgba(255,255,255,0.35);text-transform:uppercase">or</div>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
    </div>
    <a id="google-btn" href="/auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 18px;background:#fff;color:#1f1f1f;border-radius:6px;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.05em;text-decoration:none;box-sizing:border-box;font-weight:500;">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>
    <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;color:rgba(255,255,255,0.35);text-align:center;margin-top:8px;text-transform:uppercase;">Invite-only · ask your admin</div>

    <a href="https://vectraarch.live/" class="auth-back">← Back to Vectra Arch </a>
    <a href="/setup" class="auth-back" style="margin-top:6px;color:var(--accent);opacity:.7">New here? Create your hub →</a>
  </div>
</div>

<script>
  // If already authenticated, skip to app
  (function () {
    try {
      var raw  = localStorage.getItem('user');
      if (!raw) return;
      var user = JSON.parse(raw);
      if (user && user.username && user.success !== false) {
        window.location.replace('/app.html');
      }
    } catch (e) { localStorage.removeItem('user'); }
  })();

  var pendingUsername = null;     // set when 2FA is required (password flow)
  var pendingGoogle2FA = false;   // true when finishing a Google sign-in that needs TOTP

  // ── Surface ?error=... from Google OAuth redirects ────────────────────────
  (function showOAuthError() {
    var params = new URLSearchParams(window.location.search);
    var err = params.get('error');
    if (!err) return;
    var messages = {
      google_failed:        'Google sign-in failed. Please try again.',
      google_disabled:      'Google sign-in is not available right now.',
      google_no_email:      'Your Google account did not return an email address.',
      google_server:        'Server error during Google sign-in. Try again.',
      invite_required:      'Sign-up is invite-only. Ask an admin to send you an invitation.',
      invite_invalid:       'Your invitation is no longer valid (expired, revoked, or already used).',
      invite_email_mismatch:'The Google account you chose does not match the email this invite was sent to.',
    };
    var errEl = document.getElementById('auth-error');
    errEl.textContent = '⚠ ' + (messages[err] || 'Sign-in error.');
    errEl.style.display = 'block';
  })();

  // ── Post-Google sign-in 2FA stage ─────────────────────────────────────────
  (function showGoogle2FAStage() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('stage') === '2fa' && params.get('from') === 'google') {
      pendingGoogle2FA = true;
      document.getElementById('creds-fields').style.display = 'none';
      document.getElementById('google-divider').style.display = 'none';
      document.getElementById('google-btn').style.display = 'none';
      document.getElementById('twofa-field').style.display = 'flex';
      document.getElementById('submit-btn').textContent = 'Verify ↗';
      document.querySelector('.auth-sub').textContent = 'Two-factor required · enter your authenticator code';
      setTimeout(function () { document.getElementById('twofa').focus(); }, 50);
    }
  })();

  async function doLogin() {
    var username = (document.getElementById('username').value || '').trim();
    var password = document.getElementById('password').value;
    var twofa    = document.getElementById('twofa').value.trim();
    var errEl    = document.getElementById('auth-error');
    var btn      = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    // ── Google → 2FA finish ───────────────────────────────────────────────
    if (pendingGoogle2FA) {
      if (!twofa) {
        errEl.textContent   = '⚠ Enter the 6-digit code from your authenticator app.';
        errEl.style.display = 'block';
        return;
      }
      btn.textContent = 'Verifying...';
      btn.disabled    = true;
      try {
        var rg = await fetch('/api/google/verify-2fa', {
          method:      'POST',
          credentials: 'same-origin',
          headers:     { 'Content-Type': 'application/json' },
          body:        JSON.stringify({ token: twofa })
        });
        var dg = await rg.json();
        if (rg.ok && dg.success) {
          localStorage.setItem('user', JSON.stringify(dg));
          window.location.replace('/app.html');
        } else {
          errEl.textContent   = '⚠ ' + (dg.message || 'Invalid code.');
          errEl.style.display = 'block';
          btn.textContent     = 'Verify ↗';
          btn.disabled        = false;
        }
      } catch (e) {
        errEl.textContent   = '⚠ Connection error — try again.';
        errEl.style.display = 'block';
        btn.textContent     = 'Verify ↗';
        btn.disabled        = false;
      }
      return;
    }

    // ── Password → 2FA step ───────────────────────────────────────────────
    if (pendingUsername) {
      if (!twofa) {
        errEl.textContent   = '⚠ Enter the 6-digit code from your authenticator app.';
        errEl.style.display = 'block';
        return;
      }
      btn.textContent = 'Verifying...';
      btn.disabled    = true;
      try {
        var r2 = await fetch('/api/verify-2fa', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username: pendingUsername, token: twofa })
        });
        var d2 = await r2.json();
        if (r2.ok && d2.success) {
          // Store exactly as the existing app does
          localStorage.setItem('user', JSON.stringify(d2));
          window.location.replace('/app.html');
        } else {
          errEl.textContent   = '⚠ ' + (d2.message || 'Invalid code.');
          errEl.style.display = 'block';
          btn.textContent     = 'Verify ↗';
          btn.disabled        = false;
        }
      } catch (e) {
        errEl.textContent   = '⚠ Connection error — try again.';
        errEl.style.display = 'block';
        btn.textContent     = 'Verify ↗';
        btn.disabled        = false;
      }
      return;
    }

    // ── Login step ────────────────────────────────────────────────────────────
    if (!username || !password) {
      errEl.textContent   = '⚠ Username and key are required.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Authenticating...';
    btn.disabled    = true;

    try {
      var res  = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });
      var data = await res.json();

      if (!res.ok || !data.success) {
        errEl.textContent   = '⚠ ' + (data.message || 'Invalid credentials.');
        errEl.style.display = 'block';
        btn.textContent     = 'Authenticate ↗';
        btn.disabled        = false;
        return;
      }

      if (data.requires2FA) {
        // Show 2FA field
        pendingUsername = data.username || username;
        document.getElementById('twofa-field').style.display = 'flex';
        document.getElementById('twofa').focus();
        btn.textContent = 'Verify ↗';
        btn.disabled    = false;
        return;
      }

      // Success — store exactly as the existing app does
      localStorage.setItem('user', JSON.stringify(data));
      window.location.replace('/app.html');

    } catch (e) {
      errEl.textContent   = '⚠ Connection error — try again.';
      errEl.style.display = 'block';
      btn.textContent     = 'Authenticate ↗';
      btn.disabled        = false;
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
